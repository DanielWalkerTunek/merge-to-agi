<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Merge to AGI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: minimal, soft, very cute
   IDEA: a jelly jar where little models squish together and grow up into AGI
   PICTURE: the jar itself, full screen; pastel jelly blobs with faces
   COLOUR and TYPE: lilac-white ground, pastel blob per level, plum ink; Fredoka
   LAYOUT: score top centre, jar fills the rest, cards float over */
:root{color-scheme:light;--bg:#f3f0fa;--ink:#3b2f4a;--acc:#cfb3ff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 18px/1.3 Fredoka,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;touch-action:none;display:block}
#score{position:fixed;top:max(14px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:34px;pointer-events:none;font-variant-numeric:tabular-nums}
.ov{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(243,240,250,.55);backdrop-filter:blur(4px)}
.ov[hidden]{display:none}
.card{width:min(320px,100%);background:#fff;border-radius:28px;padding:28px 24px;text-align:center;box-shadow:0 20px 50px rgba(59,47,74,.15)}
h1{font-size:34px;line-height:1.05;margin:0 0 6px}
.sub{margin:0 0 20px;font-weight:500;opacity:.6}
.big{font-size:56px;line-height:1;margin:0 0 6px}
button{font:600 20px Fredoka,sans-serif;min-height:56px;width:100%;border:0;border-radius:999px;background:var(--ink);color:#fff;cursor:pointer}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
#mute{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));width:44px;height:44px;min-height:0;padding:0;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 14px rgba(59,47,74,.1);z-index:5}
#agiText{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:44px;color:#e0a100;pointer-events:none;text-shadow:0 3px 0 #fff,0 0 24px #fff;animation:agiT 1.5s ease forwards}
#agiText[hidden]{display:none}
@keyframes agiT{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){#agiText{animation:none}}
.card.over{max-height:calc(100dvh - 32px);overflow:auto}
.who{display:grid;gap:8px;margin:0 0 14px}.who[hidden],.as[hidden]{display:none}
form input:not([type=checkbox]){font:500 17px Fredoka,sans-serif;min-height:48px;border:2px solid #e8e3f5;border-radius:14px;padding:0 14px;color:var(--ink);background:#faf9fd;width:100%}
form input:not([type=checkbox]):focus{outline:none;border-color:var(--acc)}
.fine{margin:0;font-size:13px;font-weight:500;opacity:.5}
button.link{background:none;color:var(--ink);min-height:40px;font-size:16px;opacity:.6}
button.link.inline{display:inline;width:auto;min-height:0;padding:0;font-size:inherit;text-decoration:underline;opacity:.7}
.as{margin:-8px 0 12px;font-weight:500;opacity:.75}
ol.board{list-style:none;margin:0 0 16px;padding:0;text-align:left;font-weight:500;font-size:16px}
ol.board li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px}
ol.board li:nth-child(odd){background:#f6f4fb}ol.board li.me{background:#fff3c4;font-weight:600}
ol.board .rk{width:26px;opacity:.5;font-variant-numeric:tabular-nums}ol.board .dot{width:12px;height:12px;border-radius:50%;flex:none}
ol.board .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}ol.board .sc{font-variant-numeric:tabular-nums}
ol.board .gap{background:none;justify-content:center;opacity:.4;padding:0}
ol.board .msg{background:none;justify-content:center;opacity:.5;font-size:14px}
#pauseBtn{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));width:44px;height:44px;min-height:0;padding:0;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 14px rgba(59,47,74,.1);z-index:5}
#pauseBtn[hidden]{display:none}
h2{font-size:28px;margin:0 0 14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
button.soft{background:#f1edfa;color:var(--ink);min-height:50px;font-size:17px}
.menuas{margin:14px 0 0;font-size:15px}.menuas:empty{display:none}
.chk{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:500;font-size:16px;margin:2px 0 4px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--ink)}
.savebox{background:#fff8dc;border-radius:20px;padding:14px;margin:0 0 14px}
.savehead{margin:0 0 4px;font-size:18px}
#afterBtns[hidden]{display:none}
#over.lock .card{pointer-events:none}
#over .card{animation:cardIn .35s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
#agiText small{display:block;font-size:18px;color:var(--ink);opacity:.6;text-shadow:none;margin-top:4px}
.menuas button.link.inline{font-weight:600}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="score">0</div>
<button id="mute" aria-label="Sound on"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="w1" d="M16.5 8.5a5 5 0 0 1 0 7"/><path id="w2" d="M19 6a8.5 8.5 0 0 1 0 12"/><path id="mx" d="M16 9l6 6M22 9l-6 6" style="display:none"/></svg></button>

<button id="pauseBtn" aria-label="Pause" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>

<div class="ov" id="start"><div class="card">
  <h1>Merge to AGI</h1>
  <p class="sub">Squish two alike together</p>
  <button id="go">Play</button>
  <div class="row2"><button class="soft" id="openBoard">Top list</button><button class="soft" id="openProfile">Profile</button></div>
  <p class="as menuas" id="menuAs"></p>
</div></div>

<div class="ov" id="boardView" hidden><div class="card over">
  <h2>Top list</h2>
  <ol id="board2" class="board"></ol>
  <button class="soft" id="boardBack">Back</button>
</div></div>

<div class="ov" id="profileView" hidden><div class="card">
  <h2>Profile</h2>
  <form id="prof" class="who" autocomplete="on">
    <input id="nick2" maxlength="16" placeholder="Nickname" autocomplete="nickname">
    <input id="mail2" type="email" maxlength="120" placeholder="Email (optional)" autocomplete="email">
    <p class="fine">Your email is never shown. We only use it to contact winners.</p>
    <label class="chk"><input type="checkbox" id="onBoard" checked> Show me on the top list</label>
    <button type="submit">Save</button>
    <button type="button" class="link" id="profBack">Back</button>
  </form>
</div></div>

<div class="ov" id="pauseView" hidden><div class="card">
  <h2>Paused</h2>
  <button id="resume">Resume</button>
  <div class="row2"><button class="soft" id="endGame">End game</button><button class="soft" id="restart">Restart</button></div>
</div></div>

<div id="agiText" hidden></div>

<div class="ov" id="over" hidden><div class="card over">
  <p class="big" id="final">0</p>
  <p class="sub" id="bestline"></p>
  <form id="who" class="who savebox" hidden autocomplete="on">
    <p class="savehead">Save your score to the top list</p>
    <input id="nick" name="nickname" maxlength="16" placeholder="Nickname" autocomplete="nickname" enterkeyhint="next">
    <input id="mail" name="email" type="email" maxlength="120" placeholder="Email (optional)" autocomplete="email" enterkeyhint="done">
    <p class="fine">Your email is never shown. We only use it to contact winners.</p>
    <button type="submit" id="save">Save score</button>
    <button type="button" class="link" id="skip">Don't save</button>
  </form>
  <p class="as" id="as" hidden><span id="asName"></span> · <button type="button" class="link inline" id="change">change</button></p>
  <ol id="board" class="board"></ol>
  <div id="afterBtns"><button id="again">Play again</button>
  <button class="link" id="toMenu">Menu</button></div>
</div></div>

<script>
{
const cv=document.getElementById('cv'),$=id=>document.getElementById(id);let ctx=cv.getContext('2d');
const COL=['#ffb3c7','#ffc89a','#ffe38a','#b9f0a8','#9ee3f0','#a9c1ff','#cfb3ff','#ff9ea8','#ffd86b'];
const SHADE=['#f28fab','#f5a874','#f2cd5c','#8fdc7c','#6fcde0','#7f9ff5','#b08cf5','#f27482','#f5bd34'];
const PTS=[0,4,10,25,60,140,320,700,1500],INK='#3b2f4a';

/* The physics world is laid out once (W,H = world size). If the screen changes size mid-game
   (fullscreen exit with Esc, address bar, rotating, switching tabs) we only rescale the drawing,
   so the jar never moves or shrinks under the blobs. */
let BASE=[],SIZE=1,W,H,CW,BL,BR,FLOOR,TOP,LX,LY,TOPLINE,R=[],SW=0,SH=0,DPR=1,SC=1,OX=0,OY=0;
function layout(){W=SW;H=SH;SC=1;OX=OY=0;
  // Same jar shape on every device (fair top list): playable height = JAR_RATIO x width.
  // Launcher sits above the jar; whatever space is left goes above the launcher.
  const bot=Math.max(20,H*.03),topPad=80,r3k=.05225*Math.pow(1.245,3);
  CW=Math.min(W-28,(H-bot-topPad-18)/(JAR_RATIO+2*r3k));BL=(W-CW)/2;BR=BL+CW;FLOOR=H-bot;
  BASE=COL.map((_,i)=>CW*.05225*Math.pow(1.245,i));R=BASE.map(r=>r*SIZE);
  TOPLINE=FLOOR-JAR_RATIO*CW;TOP=TOPLINE-8;LY=TOP-10-BASE[3];LX=(BL+BR)/2}
const JAR_RATIO=1.7;
function fit(){SC=Math.min(SW/W,SH/H);OX=(SW-W*SC)/2;OY=(SH-H*SC)/2}
function screen(){DPR=Math.min(2,window.devicePixelRatio||1);SW=innerWidth;SH=innerHeight;cv.width=SW*DPR;cv.height=SH*DPR}
screen();layout();
const toWX=x=>(x-OX)/SC,toWY=y=>(y-OY)/SC;

let best=0;try{best=parseInt(localStorage.getItem('m2a-best'))||0}catch(e){}

/* ================= soft-body physics =================
   Each blob is a ring of particles (Verlet). Per step:
   - skin: neighbours keep their spacing
   - pressure: keeps the enclosed area (volume) constant -> bulges when squished
   - shape matching with rotation: pulls toward a rotated circle -> stable, can roll
   - blob vs blob: any particle inside another blob is pushed onto its nearest edge (no gaps, no overlap)
   Fixed 240 Hz timestep, so it behaves the same on 60 Hz and 120 Hz phones. */
const HZ=240,STEP=1/HZ,G=1500;let uid=0,blobs=[];
function makeBlob(lv,x,y,vx,vy,s0){
  const n=Math.min(30,14+lv*2),b={lv,n,r:R[lv],m:R[lv]*R[lv]/n,s:s0,sv:0,st:1,id:uid++,age:0,merge:null,happy:0,blink:2+Math.random()*3,
    xs:new Float64Array(n),ys:new Float64Array(n),pxs:new Float64Array(n),pys:new Float64Array(n),qx:new Float64Array(n),qy:new Float64Array(n),
    minx:0,miny:0,maxx:0,maxy:0,A:1,A0:1,vx:0,vy:0,cx:x,cy:y};
  for(let i=0;i<n;i++){const a=2*Math.PI*i/n;b.qx[i]=Math.cos(a);b.qy[i]=Math.sin(a);
    b.xs[i]=x+b.qx[i]*b.r*s0;b.ys[i]=y+b.qy[i]*b.r*s0;b.pxs[i]=b.xs[i]-vx*STEP;b.pys[i]=b.ys[i]-vy*STEP}
  return b}
function area(b){let A=0;const{xs,ys,n}=b;for(let i=0,j=n-1;i<n;j=i++)A+=xs[j]*ys[i]-xs[i]*ys[j];return A/2}
function cent(b){let x=0,y=0;for(let i=0;i<b.n;i++){x+=b.xs[i];y+=b.ys[i]}b.cx=x/b.n;b.cy=y/b.n}

function constrain(b){
  const{xs,ys,n,qx,qy}=b,rr=b.r*b.s,L=2*rr*Math.sin(Math.PI/n),A0=.5*n*rr*rr*Math.sin(2*Math.PI/n);b.A0=A0;
  // skin
  for(let i=0;i<n;i++){const j=(i+1)%n,dx=xs[j]-xs[i],dy=ys[j]-ys[i],d=Math.hypot(dx,dy)||1e-9,k=(d-L)/d*.2;xs[i]+=dx*k;ys[i]+=dy*k;xs[j]-=dx*k;ys[j]-=dy*k}
  // pressure
  let A=area(b),per=0;for(let i=0;i<n;i++){const j=(i+1)%n;per+=Math.hypot(xs[j]-xs[i],ys[j]-ys[i])}
  const del=(A0-A)/per*.45;
  for(let i=0;i<n;i++){const p=(i+n-1)%n,q=(i+1)%n,ex=xs[q]-xs[p],ey=ys[q]-ys[p],l=Math.hypot(ex,ey)||1e-9;xs[i]+=ey/l*del;ys[i]-=ex/l*del}
  // shape matching (rotation-aware)
  cent(b);let a=0,c=0;for(let i=0;i<n;i++){const px=xs[i]-b.cx,py=ys[i]-b.cy;a+=qx[i]*px+qy[i]*py;c+=qx[i]*py-qy[i]*px}
  const th=Math.atan2(c,a),co=Math.cos(th),si=Math.sin(th),k=.075-b.lv*.006;
  for(let i=0;i<n;i++){const gx=b.cx+rr*(co*qx[i]-si*qy[i]),gy=b.cy+rr*(si*qx[i]+co*qy[i]);xs[i]+=(gx-xs[i])*k;ys[i]+=(gy-ys[i])*k}
}
function bbox(b){let a=1e9,c=1e9,d=-1e9,e=-1e9;for(let i=0;i<b.n;i++){const x=b.xs[i],y=b.ys[i];if(x<a)a=x;if(x>d)d=x;if(y<c)c=y;if(y>e)e=y}b.minx=a;b.miny=c;b.maxx=d;b.maxy=e}
function inside(B,x,y){let o=false;const{xs,ys,n}=B;for(let i=0,j=n-1;i<n;j=i++)if((ys[i]>y)!==(ys[j]>y)&&x<(xs[j]-xs[i])*(y-ys[i])/(ys[j]-ys[i])+xs[i])o=!o;return o}
const MU=.35;
function pushOut(A,B){ // A's particles out of B
  let hit=false;const{xs,ys,n}=B;
  for(let k=0;k<A.n;k++){const x=A.xs[k],y=A.ys[k];if(x<B.minx||x>B.maxx||y<B.miny||y>B.maxy||!inside(B,x,y))continue;
    let bd=1e18,bi=0,bt=0,bx=0,by=0;
    for(let i=0;i<n;i++){const j=(i+1)%n,ex=xs[j]-xs[i],ey=ys[j]-ys[i],l2=ex*ex+ey*ey||1e-9;let t=((x-xs[i])*ex+(y-ys[i])*ey)/l2;t=t<0?0:t>1?1:t;
      const cx=xs[i]+ex*t,cy=ys[i]+ey*t,d=(cx-x)**2+(cy-y)**2;if(d<bd){bd=d;bi=i;bt=t;bx=cx;by=cy}}
    const dx=bx-x,dy=by-y,j=(bi+1)%n,w=1/(1+(1-bt)**2+bt**2);
    // mass-weighted: light (small) blobs get pushed, heavy ones hold their ground
    const wa=B.m/(A.m+B.m)*2,wb=A.m/(A.m+B.m)*2;
    A.xs[k]+=dx*w*wa;A.ys[k]+=dy*w*wa;
    xs[bi]-=dx*w*wb*(1-bt);ys[bi]-=dy*w*wb*(1-bt);xs[j]-=dx*w*wb*bt;ys[j]-=dy*w*wb*bt;
    // real friction: remove part of the relative sliding along the contact
    const d=Math.hypot(dx,dy)||1e-9,nx=dx/d,ny=dy/d,
      rvx=(A.xs[k]-A.pxs[k])-((xs[bi]-B.pxs[bi])*(1-bt)+(xs[j]-B.pxs[j])*bt),
      rvy=(A.ys[k]-A.pys[k])-((ys[bi]-B.pys[bi])*(1-bt)+(ys[j]-B.pys[j])*bt),
      rn=rvx*nx+rvy*ny,tx=(rvx-rn*nx)*MU,ty=(rvy-rn*ny)*MU;
    A.pxs[k]+=tx*wa*.5;A.pys[k]+=ty*wa*.5;
    B.pxs[bi]-=tx*wb*.5*(1-bt);B.pys[bi]-=ty*wb*.5*(1-bt);B.pxs[j]-=tx*wb*.5*bt;B.pys[j]-=ty*wb*.5*bt;
    hit=true}
  return hit}

/* Damping, done per blob on its velocities:
   - wobble (deformation relative to the blob's own motion) is damped -> gooey, not springy
   - spin is damped -> no crazy rotation after merges
   - per-particle speed is capped -> nothing gets flung out */
const KW=.035,KS=.015,VCAP=8;
function damp(b){const{xs,ys,pxs,pys,n}=b;cent(b);
  if(!Number.isFinite(b.cx)||!Number.isFinite(b.cy)){const gx=b.gx??LX,gy=b.gy??FLOOR-b.r;for(let i=0;i<n;i++){xs[i]=pxs[i]=gx+b.qx[i]*b.r*b.s;ys[i]=pys[i]=gy+b.qy[i]*b.r*b.s}cent(b)}else{b.gx=b.cx;b.gy=b.cy}let mx=0,my=0;for(let i=0;i<n;i++){mx+=xs[i]-pxs[i];my+=ys[i]-pys[i]}mx/=n;my/=n;
  let L=0,I=0;for(let i=0;i<n;i++){const rx=xs[i]-b.cx,ry=ys[i]-b.cy;L+=rx*(ys[i]-pys[i]-my)-ry*(xs[i]-pxs[i]-mx);I+=rx*rx+ry*ry}const w=L/(I||1);
  for(let i=0;i<n;i++){const rx=xs[i]-b.cx,ry=ys[i]-b.cy,ox=-w*ry,oy=w*rx;let vx=xs[i]-pxs[i],vy=ys[i]-pys[i];
    const dx=vx-mx-ox,dy=vy-my-oy;vx=mx+ox*(1-KS)+dx*(1-KW);vy=my+oy*(1-KS)+dy*(1-KW);
    const sp=Math.hypot(vx,vy);if(sp>VCAP){vx*=VCAP/sp;vy*=VCAP/sp}pxs[i]=xs[i]-vx;pys[i]=ys[i]-vy}}
function step(){
  const g=G*STEP*STEP;
  for(const b of blobs){
    b.sv+=((b.st-b.s)*90-b.sv*19)*STEP;b.s+=b.sv*STEP; // smooth (critically damped) grow / shrink
    damp(b);
    const{xs,ys,pxs,pys,n}=b;
    for(let i=0;i<n;i++){const vx=(xs[i]-pxs[i])*.9992,vy=(ys[i]-pys[i])*.9992;pxs[i]=xs[i];pys[i]=ys[i];xs[i]+=vx;ys[i]+=vy+g}
    if(b.merge){cent(b);const m=b.merge;for(let i=0;i<n;i++){xs[i]+=(m.mx-b.cx)*.03;ys[i]+=(m.my-b.cy)*.03}}
  }
  for(let it=0;it<2;it++)for(const b of blobs)constrain(b);
  for(const b of blobs)bbox(b);
  for(let i=0;i<blobs.length;i++)for(let j=i+1;j<blobs.length;j++){const A=blobs[i],B=blobs[j];
    if(A.maxx<B.minx||B.maxx<A.minx||A.maxy<B.miny||B.maxy<A.miny)continue;
    if(A.merge&&A.merge.o===B)continue;
    const h1=pushOut(A,B),h2=pushOut(B,A);
    if((h1||h2)&&A.lv===B.lv&&!A.merge&&!B.merge&&A.age>.12&&B.age>.12&&state!=='menu'){cent(A);cent(B);const mx=(A.cx+B.cx)/2,my=(A.cy+B.cy)/2;
      A.merge={o:B,t:0,mx,my};B.merge={o:A,t:0,mx,my};A.st=B.st=.55}}
  for(const b of blobs){const{xs,ys,pxs,pys,n}=b;
    for(let i=0;i<n;i++){
      if(ys[i]>FLOOR){ys[i]=FLOOR;pxs[i]=xs[i]-(xs[i]-pxs[i])*.82}
      if(xs[i]<BL){xs[i]=BL;pys[i]=ys[i]-(ys[i]-pys[i])*.9}
      if(xs[i]>BR){xs[i]=BR;pys[i]=ys[i]-(ys[i]-pys[i])*.9}}}
}

/* ================= sound + haptics (synthesised, no files) ================= */
let AC=null,muted=false,NOISE=null;try{muted=localStorage.getItem('m2a-mute')==='1'}catch(e){}
function audio(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*.25;NOISE=AC.createBuffer(1,n,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}
  if(AC.state==='suspended')AC.resume().catch(()=>{})}catch(e){}}
function tone(f0,f1,dur,type,vol,delay=0){if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.03)}
function hiss(dur,freq,vol){if(muted||!AC)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NOISE;f.type='lowpass';

requestAnimationFrame(loop);

/* ================= input: drag to aim, release to shoot ================= */
function pause(){if(state!=='run')return;state='paused';charging=false;down=false;$('pauseView').hidden=false}
function resume(){if(state!=='paused')return;$('pauseView').hidden=true;state='run';last=performance.now()}
$('pauseBtn').addEventListener('click',()=>{audio();pause()});
$('resume').addEventListener('click',resume);
$('endGame').addEventListener('click',()=>{$('pauseView').hidden=true;state='run';gameOver()});
$('restart').addEventListener('click',()=>{$('pauseView').hidden=true;start()});
$('toMenu').addEventListener('click',()=>{$('over').hidden=true;state='menu';buildDemo();$('start').hidden=false;menuAs()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)pause()});
function start(){audio();try{const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(()=>{})}catch(e){}
  reset();state='run';$('start').hidden=true;$('over').hidden=true}
$('go').addEventListener('click',start);$('again').addEventListener('click',start);
let down=false;
cv.addEventListener('pointerdown',e=>{audio();if(trySwap(toWX(e.clientX),toWY(e.clientY)))return;down=true;setAim(toWX(e.clientX),toWY(e.clientY));startCharge()});
cv.addEventListener('pointermove',e=>{if(down||e.pointerType==='mouse')setAim(toWX(e.clientX),toWY(e.clientY))});
cv.addEventListener('pointerup',e=>{if(down){setAim(toWX(e.clientX),toWY(e.clientY));release()}down=false});
cv.addEventListener('pointercancel',()=>{down=false;charging=false});
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;const c=e.code;
  if(c==='Escape'||c==='KeyP'){if(state==='run')pause();else if(state==='paused')resume();return}
  if(!$('boardView').hidden||!$('profileView').hidden||state==='paused')return;
  if(c==='ArrowLeft'||c==='KeyA'){e.preventDefault();aimA=Math.max(-AMAX,aimA-.06)}
  else if(c==='ArrowRight'||c==='KeyD'){e.preventDefault();aimA=Math.min(AMAX,aimA+.06)}
  else if(c==='KeyS'||c==='KeyQ'){e.preventDefault();const p=nextPos();trySwap(p.nx,p.ny)}
  else if(c==='Space'||c==='ArrowDown'){e.preventDefault();if(e.repeat)return;if(state==='run')startCharge();else if(state!=='pause')start()}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowDown')release()});
}
</script>
</body>
</html>
